[project]
name = "typeicon-import"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
description = "TypeIcon source-pack importers and catalog builder"
dependencies = ["typeicon-fonts", "psycopg[binary]==3.3.6", "boto3==1.40.40"]

[project.scripts]
typeicon-import = "typeicon_import.cli:main"
typeicon-review-sheets = "typeicon_import.cli:review_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/typeicon_import"]
