<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src https://typeicon.net http://localhost:3107">
<title>TypeIcon</title>
<style>
  :root {
    --bg: var(--figma-color-bg, #ffffff);
    --bg-2: var(--figma-color-bg-secondary, #f5f5f5);
    --bg-hover: var(--figma-color-bg-hover, #f0f0f0);
    --text: var(--figma-color-text, #1e1e1e);
    --text-2: var(--figma-color-text-secondary, #6b6b6b);
    --border: var(--figma-color-border, #e6e6e6);
    --brand: var(--figma-color-bg-brand, #0d99ff);
    --on-brand: var(--figma-color-text-onbrand, #ffffff);
    --danger: var(--figma-color-text-danger, #dc3412);
    --focus: var(--figma-color-border-selected, #0d99ff);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font: 11px/1.4 Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex; flex-direction: column;
  }
  header { padding: 8px 8px 6px; border-bottom: 1px solid var(--border); display: grid; gap: 6px; }
  .row { display: flex; gap: 6px; align-items: center; }
  input[type="search"], input[type="url"], select {
    flex: 1; min-width: 0; height: 28px; padding: 0 8px; border-radius: 4px;
    border: 1px solid var(--border); background: var(--bg); color: var(--text); font: inherit;
  }
  input:focus-visible, select:focus-visible, button:focus-visible { outline: 2px solid var(--focus); outline-offset: -1px; }
  .seg { display: flex; border: 1px solid var(--border); border-radius: 4px; overflow: hidden; flex: 1; }
  .seg button { flex: 1; height: 24px; border: 0; background: transparent; color: var(--text-2); font: inherit; cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--bg-2); color: var(--text); font-weight: 600; }
  .icon-btn { height: 28px; min-width: 28px; border: 1px solid var(--border); border-radius: 4px; background: var(--bg); color: var(--text); cursor: pointer; font: inherit; }
  .color-row label { display: flex; gap: 4px; align-items: center; color: var(--text-2); }
  input[type="color"] { width: 28px; height: 20px; padding: 0; border: 1px solid var(--border); background: none; }
  #settings { display: none; gap: 6px; padding: 8px; border-bottom: 1px solid var(--border); background: var(--bg-2); }
  #settings.open { display: grid; }
  #settings .hint { color: var(--text-2); }
  #settings .err { color: var(--danger); min-height: 1em; }
  main { flex: 1; overflow-y: auto; padding: 8px; }
  #status { color: var(--text-2); padding: 4px 0 8px; }
  #status.error { color: var(--danger); }
  #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(72px, 1fr)); gap: 4px; list-style: none; margin: 0; padding: 0; }
  .cell {
    width: 100%; aspect-ratio: 1 / 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
    border: 1px solid transparent; border-radius: 6px; background: transparent; color: var(--text); cursor: pointer; padding: 4px; font: inherit;
  }
  .cell:hover { background: var(--bg-hover); }
  .cell:focus-visible, .cell[aria-selected="true"] { border-color: var(--focus); outline: none; }
  .cell svg { width: 24px; height: 24px; }
  .cell .label { width: 100%; font-size: 9px; color: var(--text-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: center; }
  .cell.unavailable { cursor: not-allowed; opacity: .55; }
  .cell .na { width: 24px; height: 24px; border: 1px dashed var(--text-2); border-radius: 4px; }
  #more { display: none; margin: 10px auto 4px; }
  #more.show { display: block; }
  footer { border-top: 1px solid var(--border); padding: 6px 8px; min-height: 44px; display: flex; gap: 8px; align-items: center; }
  footer .meta { flex: 1; min-width: 0; }
  footer .meta div { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  footer .meta .sub { color: var(--text-2); }
  .primary { height: 28px; padding: 0 12px; border: 0; border-radius: 4px; background: var(--brand); color: var(--on-brand); font: inherit; font-weight: 600; cursor: pointer; }
  .primary:disabled { opacity: .4; cursor: not-allowed; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
</style>
</head>
<body>
<header>
  <div class="row">
    <label for="q" class="sr-only">Search icons</label>
    <input id="q" type="search" placeholder="Search icons…" autocomplete="off" spellcheck="false" maxlength="100" autofocus>
    <button id="settings-toggle" class="icon-btn" type="button" aria-expanded="false" aria-controls="settings" title="Settings">⚙</button>
  </div>
  <div class="row">
    <div class="seg" role="group" aria-label="Style" id="style-group">
      <button type="button" data-style="all" aria-pressed="true">All</button>
      <button type="button" data-style="filled" aria-pressed="false">Filled</button>
      <button type="button" data-style="line" aria-pressed="false">Line</button>
      <button type="button" data-style="rounded" aria-pressed="false">Rounded</button>
      <button type="button" data-style="thin" aria-pressed="false">Thin</button>
    </div>
  </div>
  <div class="row">
    <div class="seg" role="group" aria-label="Source" id="area-group">
      <button type="button" data-area="all" aria-pressed="true">All sources</button>
      <button type="button" data-area="core" aria-pressed="false">Core</button>
      <button type="button" data-area="brands" aria-pressed="false">Brands</button>
    </div>
  </div>
  <div class="row color-row">
    <label><input id="use-color" type="checkbox"> Custom color</label>
    <input id="color" type="color" value="#000000" aria-label="Icon color" disabled>
    <span class="sub" id="color-hint" style="color: var(--text-2)">Inserted as black (#000000)</span>
  </div>
</header>
<section id="settings" aria-label="Settings">
  <label for="api-base">Catalog API base URL</label>
  <div class="row">
    <input id="api-base" type="url" spellcheck="false" autocomplete="off">
    <button id="api-save" class="icon-btn" type="button" style="padding: 0 8px">Save</button>
    <button id="api-reset" class="icon-btn" type="button" style="padding: 0 8px">Reset</button>
  </div>
  <div class="hint" id="api-hint"></div>
  <div class="err" id="api-err" role="alert"></div>
</section>
<main id="scroller">
  <div id="status" role="status" aria-live="polite"></div>
  <div id="grid" role="listbox" aria-label="Icons"></div>
  <button id="more" class="icon-btn" type="button" style="padding: 0 12px">Load more</button>
</main>
<footer>
  <div class="meta" id="details"><div class="sub">Select an icon. Enter inserts the focused icon.</div></div>
  <button id="insert" class="primary" type="button" disabled>Insert</button>
</footer>
<!-- UI_SCRIPT -->
</body>
</html>
