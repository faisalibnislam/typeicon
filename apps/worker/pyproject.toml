[project]
name = "typeicon-worker"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
description = "TypeIcon background worker: font builds, subset kits, release packaging"
dependencies = ["typeicon-fonts", "typeicon-import", "psycopg[binary]==3.3.6", "boto3==1.40.40"]

[project.scripts]
typeicon-worker = "typeicon_worker.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/typeicon_worker"]
