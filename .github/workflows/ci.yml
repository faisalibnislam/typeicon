# Continuous integration (written but not yet run, because the repository has not been pushed).
name: ci
on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_USER: typeicon, POSTGRES_HOST_AUTH_METHOD: trust, POSTGRES_DB: typeicon }
        ports: ["54329:5432"]
        options: --health-cmd "pg_isready -U typeicon" --health-interval 5s --health-retries 20
    env:
      DATABASE_URL: postgres://typeicon@localhost:54329/typeicon
      TEST_DATABASE_URL: postgres://typeicon@localhost:54329/typeicon_test
      BETTER_AUTH_SECRET: ci-only-secret-not-used-elsewhere-0123456789
      BETTER_AUTH_URL: http://localhost:3107
      NEXT_PUBLIC_SITE_URL: http://localhost:3107
      STORAGE_DRIVER: fs
      STORAGE_FS_ROOT: .data/storage
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - uses: astral-sh/setup-uv@v6
      - run: uv python install 3.12 && uv sync --all-packages --frozen
      - run: pnpm install --frozen-lockfile
      - name: Codepoint registry is append-only
        if: github.event_name == 'pull_request'
        run: |
          git show origin/${{ github.base_ref }}:assets/registry/codepoints.json > /tmp/prev-codepoints.json || echo '{"namespaces":{}}' > /tmp/prev-codepoints.json
          .venv/bin/typeicon-import check-registry --against /tmp/prev-codepoints.json
      - run: psql postgres://typeicon@localhost:54329/postgres -c "CREATE DATABASE typeicon_test"
      - run: pnpm db:migrate && DATABASE_URL=$TEST_DATABASE_URL pnpm db:migrate
      - run: .venv/bin/python tools/core-authoring/export.py
      - run: .venv/bin/typeicon-import build
      - run: .venv/bin/typeicon-import release --version 0.1.0 --date 2026-09-30
      - run: .venv/bin/typeicon-import db-load && .venv/bin/typeicon-import db-load --database-url $TEST_DATABASE_URL
      - run: .venv/bin/typeicon-import audit --raster
      - run: .venv/bin/pytest -q
      - run: pnpm --filter @typeicon/web typecheck && pnpm --filter @typeicon/web test
      - run: pnpm build
      - run: node packages/scripts/generate.mjs --quiet && node packages/scripts/verify.mjs
      - run: pnpm --filter @typeicon/figma-plugin build && pnpm --filter @typeicon/figma-plugin test
      - name: End-to-end
        run: |
          (cd apps/web && npx tsx --conditions=react-server --tsconfig tsconfig.json scripts/seed-dev-users.ts)
          (cd apps/web && npx playwright install --with-deps chromium && npx playwright test)
